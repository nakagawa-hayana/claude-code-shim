[package]
name = "claude-shim"
version = "0.1.0"
edition = "2021"
description = "Local HTTP proxy that appends an override prompt to Claude Code's system prompt"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde_json = "1"
